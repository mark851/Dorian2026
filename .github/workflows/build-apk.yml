name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          
          JAVA_VER_STR=$(java -version 2>&1 | head -n 1)
          echo "Java version string: $JAVA_VER_STR"
          
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Failed to detect active Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version is $JAVA_MAJOR, which is lower than required version 17."
            exit 1
          fi
          
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation step."
            exit 1
          fi
          
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Expected APK $TARGET_APK not found!"
            echo "Searching only inside app/build/outputs/apk for generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$TARGET_APK" ]; then
            echo "Error: Generated APK $TARGET_APK is empty (0 bytes)."
            exit 1
          fi
          
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "Error: $TARGET_APK does not have .apk extension."; exit 1 ;;
          esac
          
          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK path does not match expected target exactly."
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$TARGET_APK" 2>/dev/null || stat -f%z "$TARGET_APK" 2>/dev/null)
          echo "Successfully verified debug APK: $TARGET_APK ($APK_SIZE bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$ASSET_DIR"
          
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9._-]/-/g')
          
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          
          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH"
            exit 1
          fi
          
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_FILENAME at $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty. Aborting release creation."
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Asset does not have .apk extension. Aborting."; exit 1 ;;
          esac
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          echo "Constructed unique release tag: $RELEASE_TAG"
          echo "Release title: $RELEASE_TITLE"
          echo "Target commit: ${{ github.sha }}"
          
          NOTES=$(cat << 'EOF'
          ### 📱 Dora Fashions Debug APK Build
          
          This is an automatically generated debug APK build for testing purposes.
          
          - **GitHub Actions Run Number:** #${{ github.run_number }}
          - **GitHub Actions Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** `${{ github.sha }}`
          - **Built By:** GitHub Actions (`ubuntu-latest`)
          - **Environment:** Eclipse Temurin Java 17, Gradle 9.3.1
          - **Testing Notice:** This APK is intended for testing and review. It is not a Google Play Store production release.
          - **Signature:** Signed with a temporary Android debug keystore.
          
          #### Direct APK Download
          Download the attached `.apk` file below under the **Assets** section and install directly on your Android device.
          EOF
          )
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest
          
          echo "Release successfully created with tag: $RELEASE_TAG"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK Release Summary Report ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG"
            
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Direct APK Asset: $ASSET_FILENAME"
            
            {
              echo "### ✅ Debug APK Built & Published Successfully"
              echo ""
              echo "- **Direct Download Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset Filename:** \`$ASSET_FILENAME\`"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo ""
              echo "You can download the APK file directly from the **Assets** section of the release above and install it on any Android phone."
              echo ""
              echo "> ℹ️ **Backup:** The normal Actions artifact \`app-debug-apk\` is also uploaded and available on this workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an issue. However, the APK build and artifact upload succeeded!"
            echo "The debug APK artifact 'app-debug-apk' is preserved and available for download under the workflow run artifacts."
            
            {
              echo "### ⚠️ Debug APK Built (Release Publishing Notice)"
              echo ""
              echo "The debug APK build and artifact upload **succeeded**."
              echo ""
              echo "GitHub Release creation was not completed. However, your APK is preserved and immediately available for download:"
              echo ""
              echo "👉 **Download Artifact:** Go to the **Summary** tab of this workflow run and download **\`app-debug-apk\`**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
